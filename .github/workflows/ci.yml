name: ci

# Continuous integration exists here mostly to protect one thing: that the core
# ARClient links against still understands the configuration it generates.
#
# The newest *tagged* xray-core release predates the fragment lengths/delays
# arrays that the working FragB profile depends on, and the core's JSON loader
# drops a field it does not recognise without complaint. A dependency bump
# therefore produces a binary that starts, accepts the config, and fragments by
# a different rule than the one that works — with no error anywhere. The test
# that catches this is internal/engine.TestCorePreservesFragBFragmentLengths,
# and it only runs if CI runs it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.1"

jobs:
  test:
    name: test (windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify the pinned core is a commit, not a tag
        shell: pwsh
        run: |
          $pinned = (go list -m github.com/xtls/xray-core) -replace '^github.com/xtls/xray-core\s+', ''
          Write-Host "pinned xray-core: $pinned"

          # A pseudo-version carries the -0.<timestamp>-<sha> segment that marks
          # a commit rather than a release. Matching on that shape rather than on
          # a list of known-good tags means a future tag is rejected by default
          # instead of having to be recognised.
          if ($pinned -notmatch '-0\.\d{14}-[0-9a-f]{12}$') {
            Write-Host ""
            Write-Host "FAIL: xray-core is pinned to a tagged release."
            Write-Host ""
            Write-Host "The fragment finalmask lengths/delays arrays this project depends on"
            Write-Host "arrived in XTLS/Xray-core PR #6334 and are in no tagged release. A"
            Write-Host "tagged core silently ignores them: it starts, accepts the config, and"
            Write-Host "fragments by a different rule than the one that works. There is no"
            Write-Host "error. The only symptom is a client that loads and cannot connect."
            Write-Host ""
            Write-Host "Pin a commit instead:"
            Write-Host "  go get github.com/xtls/xray-core@e5e85ca9dada936ae736197ad2b7a685972e8e0f"
            exit 1
          }

      - name: gofmt
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) {
            Write-Error "gofmt needed:`n$($unformatted -join "`n")"
            exit 1
          }

      - name: go vet
        run: go vet ./...

      - name: go test
        # No -race: it needs cgo, and the hosted Windows runner has no C
        # toolchain configured for it. The supervisor's locking is covered by
        # the tests themselves rather than by the detector, which is the weaker
        # of the two options available here.
        run: go test -timeout 10m ./...

      - name: Build
        run: go build ./...

  selftest-artifact:
    name: selftest binary
    runs-on: windows-2022
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The selftest is the instrument for the questions CI cannot answer,
      # because it has to run on the target network. Producing it on every push
      # means the answer is one download away rather than a local build.
      - name: Build selftest
        run: go build -trimpath -ldflags "-s -w" -o dist/ARClient-selftest.exe ./cmd/selftest

      - uses: actions/upload-artifact@v4
        with:
          name: ARClient-selftest
          path: dist/ARClient-selftest.exe
          retention-days: 30
